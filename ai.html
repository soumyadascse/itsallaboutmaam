<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"

    <title>Love AI ❤️ | Soumya & Sharmila</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="hearts"></div>


<!-- NAVIGATION -->

<nav class="love-nav">

    <div class="nav-brand">
        S ❤️ S
    </div>

    <div class="nav-links">

        <a href="index.html">
            Home
        </a>

        <a href="games.html">
            Games 🎮
        </a>

        <a href="numerology.html">
            Our Numbers 🔢
        </a>

        <a href="ai.html">
            Love AI 🤖
        </a>

    </div>

</nav>


<!-- AI HEADER -->

<section class="ai-header">

    <div class="container text-center">

        <div class="ai-icon">
            🤖❤️
        </div>

        <p class="section-label">
            MADE JUST FOR US
        </p>

        <h1>
            Love AI
        </h1>

        <p>
            Ask me anything about
            <strong>Soumya & Sharmila</strong>.
        </p>

    </div>

</section>


<!-- CHAT -->

<section class="ai-chat-section">

    <div class="container">

        <div class="ai-chat-box">

            <div class="ai-welcome">

                <div class="ai-avatar">
                    ❤️
                </div>

                <div>

                    <strong>
                        Love AI
                    </strong>

                    <p>
                        Hi Sharmila! ❤️
                        I'm here to talk about
                        your little love story with Soumya.
                    </p>

                </div>

            </div>


            <!-- CHAT MESSAGES -->

            <div id="chatMessages"
                 class="chat-messages">

            </div>


            <!-- TYPING -->

            <div id="typing"
                 class="typing"
                 style="display:none;">

                Love AI is thinking
                <span>•••</span>

            </div>


            <!-- INPUT -->

            <div class="chat-input-area">

                <input
                    type="text"
                    id="userMessage"
                    placeholder="Ask something about us ❤️"
                    autocomplete="off">

                <button
                    id="sendMessage">

                    <i class="bi bi-heart-fill"></i>

                </button>

            </div>


            <!-- SUGGESTIONS -->

            <div class="suggestions">

                <button class="suggestion">
                    Do you think Soumya misses me?
                </button>

                <button class="suggestion">
                    What was our first memory?
                </button>

                <button class="suggestion">
                    Write a message from Soumya
                </button>

            </div>

        </div>

    </div>

</section>


<footer>

    <p>
        Made with ❤️ by Soumya for Sharmila
    </p>

    <a href="index.html">
        ← Back to our story
    </a>

</footer>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

<script src="script.js"></script>

</body>

</html>
